<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> <!-- Define o padrão de caracteres -->
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/style3.css"><!-- Importa o arquivo CSS -->
</head>
<body>
        <div class="card"><!-- Card central -->
        <h1>Cadastro</h1> <!-- Título da página -->
        <form> <!-- Formulário apenas visual -->
            <label>Nome:</label>       <!-- Texto do campo -->
            <input type="text">        <!-- Campo de texto -->
            <label>E-mail:</label>
            <input type="email">
            <label>Endereço:</label>
            <input type="text">
            <label>Telefone:</label>
            <input type="text">
            <p>Qual o nome do pet escolhido:</p><!-- Texto explicativo -->
            <label>Pet:</label>
            <input type="text">
            <div class="botoes"><!-- Botões -->
                <button>Cadastrar</button>            <!-- Mostra ação -->
                <button type="reset">Redefinir</button><!-- Limpa campos -->
            </div>
        </form>
            <div class="redes"><!-- Ícones de redes sociais -->
            <img src="img/insta.jpg" alt="Instagram">
            <img src="img/face.png" alt="Facebook">
            <img src="img/whats.jpg" alt="WhatsApp">
        </div>
            <a href="index.html" class="voltar">Voltar</a><!-- Link para voltar -->
        </div>
</body>
</html>
