<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> <!-- Define o conjunto de caracteres -->
    <title>Focinhos Disponíveis</title>
    <link rel="stylesheet" href="css/style2.css"><!-- Importa o CSS externo --><script src="js/pets.js"></script><!-- Importa o Javascript externo -->
</head>
<body>
    <main class="container"><!-- Centraliza o conteúdo na tela -->
        <section class="card"><!-- Card principal -->
            <h1>Focinhos Disponíveis</h1> <!-- Título da página -->
            <article class="animal"><!-- Pet 1 -->
                <div class="foto"><img src="img/cao2.png" alt="Cachorro Caramelo" data-nome="Caramelo" data-idade="3 anos" data-peso="12 kg" data-altura="50 cm" data-cor="Caramelo"></div>
                <div class="info">
                    <h2>Caramelo</h2>
                    <p>Cão dócil, porte médio, 3 anos.</p>
                </div>
            </article>
            <article class="animal"><!-- Pet 2 -->
                <div class="foto"><img src="img/cao3.png" alt="Cachorra Estrela" data-nome="Estrela" data-idade="2 anos" data-peso="8 kg" data-altura="40 cm" data-cor="Marrom e branco"></div>
                <div class="info">
                    <h2>Estrela</h2>
                    <p>Meiga, 2 anos, muito ativa.</p>
                </div>
            </article>
            <article class="animal"><!-- Pet 3 -->
                <div class="foto"><img src="img/cao4.png" alt="Cachorro Sabão"data-nome="Sabão" data-idade="3 meses" data-peso="3 kg" data-altura="25 cm" data-cor="Branco"></div>
                <div class="info">
                    <h2>Sabão</h2>
                    <p>Filhote, 3 meses, porte pequeno.</p>
                </div>
            </article>
            <a href="index.html" class="voltar">Voltar</a><!-- Link para voltar -->
        </section>
    </main>
</body>
</html>
